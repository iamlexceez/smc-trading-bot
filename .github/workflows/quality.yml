name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pytest-asyncio coverage ruff
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run focused and smoke tests
        run: |
          python -m pytest -q
          python tests/smoke_upgrade.py
      - name: Check formatting and high-confidence lint errors in maintained upgrade surface
        run: ruff check analysis/market_state.py analysis/opportunity.py tests/test_upgrade_safety.py
