[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-trading-bot"
version = "0.1.0"
description = "Evidence-aware SMC trading bot"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["analysis", "backtest", "bot", "data", "execution", "executors", "risk", "storage", "strategy"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["docs", "*.pdf"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
